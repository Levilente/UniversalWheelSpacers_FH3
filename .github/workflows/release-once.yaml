name: Release 1.0.1 (one-off)

# Runs when the branch release-1.0.1 is pushed: builds the DLL on GitHub and
# publishes the v1.0.1 release (the tag is created by the release).

on:
  push:
    branches: ["release-1.0.1"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Levilente/FH3_ModPlatform
          path: platform
          persist-credentials: false
      - name: Install llvm-mingw + ninja
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -o llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo /opt/llvm-mingw/bin >> "$GITHUB_PATH"
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=platform/cmake/mingw-w64-x86_64.cmake -DFH3_PLATFORM_DIR=$PWD/platform
          cmake --build build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Needs FH3 Mod Platform 1.0.0 or newer." >> notes.md
          gh release create v1.0.1 build/WheelSpacers.dll --target "$GITHUB_SHA" --title "Universal Wheel Spacers for FH3 1.0.1" --notes-file notes.md
