name: Release 1.0.0 (one-off)

# Runs when the branch release-1.0.0 is pushed: builds on GitHub, publishes the v1.0.0 release (the tag is created
# by the release) and deletes the branch.

on:
  push:
    branches: ["release-1.0.0"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: Levilente/FH3_ModPlatform
          path: platform
          persist-credentials: false
      - name: Install llvm-mingw + ninja
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -o llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo /opt/llvm-mingw/bin >> "$GITHUB_PATH"
      - name: Build
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=platform/cmake/mingw-w64-x86_64.cmake -DFH3_PLATFORM_DIR=$PWD/platform
          cmake --build build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          printf '\n**Needs the [FH3 Mod Platform](https://github.com/Levilente/FH3_ModPlatform) 1.0.0 or newer.** Copy `WheelSpacers.dll` into `fh3-mods`.\n' >> notes.md
          gh release create v1.0.0 build/WheelSpacers.dll --target "$GITHUB_SHA" --title "Universal Wheel Spacers for FH3 1.0.0" --notes-file notes.md
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release-1.0.0" || true
